<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>End For Real · AR</title><style>
*{box-sizing:border-box}body{margin:0;background:#11131c;color:#fff;font:16px system-ui,sans-serif}main{max-width:540px;margin:auto;padding:16px;display:grid;gap:14px}header{display:flex;justify-content:space-between;align-items:center}small{color:#aeb8cc}#view{position:relative;overflow:hidden;background:#272d3b;border-radius:24px;aspect-ratio:3/4;isolation:isolate}video,#photo{position:absolute;width:100%;height:100%;object-fit:contain;inset:0}#guide{position:absolute;inset:34% 26%;border:2px dashed #fff9;border-radius:14px;pointer-events:none}#anchor{position:absolute;left:0;top:0;width:200px;height:200px;transform-origin:0 0;pointer-events:none;visibility:hidden}#anchor.visible{visibility:visible}#card{position:absolute;left:-36px;top:-205px;width:272px;padding:18px;background:#f7f8ff;color:#25263b;border:2px solid #cbd6ff;border-radius:20px;text-align:center;box-shadow:0 12px 28px #0005;transform-origin:50% 100%}#anchor.visible #card{animation:rise .48s cubic-bezier(.2,.8,.2,1.2) both}#card:after{content:'';position:absolute;bottom:-10px;left:calc(50% - 10px);width:18px;height:18px;background:#f7f8ff;transform:rotate(45deg);border-right:2px solid #cbd6ff;border-bottom:2px solid #cbd6ff}#card h1{font-size:27px;line-height:1;margin:9px 0}#card p{font-size:15px;line-height:1.4;margin:8px 0}#card b,#card small{color:#3971fb}#card .star{font-size:30px;color:#3971fb}#status{text-align:center;min-height:42px;margin:0;color:#d9e0ef}button,label.file{font:700 16px system-ui;border:0;border-radius:999px;padding:14px;background:#3971fb;color:white;text-align:center;cursor:pointer}label.file{background:#303644}input{position:absolute;width:1px;height:1px;opacity:0}label:focus-within{outline:2px solid white}button:disabled{opacity:.5}@keyframes rise{from{opacity:0;transform:translateY(70px) scale(.2)}to{opacity:1;transform:none}}@media(prefers-reduced-motion:reduce){#anchor.visible #card{animation:none}}
</style></head><body><main><header><strong>✦ END FOR REAL</strong><a href="index.html" style="color:#fff;text-decoration:none" aria-label="Back to homepage">← Home</a></header><div id="view"><video id="video" playsinline muted></video><img id="photo" hidden alt="Uploaded QR image"><div id="guide"></div><div id="anchor"><article id="card"><small>✦ END REAL · 001</small><div class="star">✦</div><h1>Hello, there!</h1><p>You've successfully unlocked your first digital card.</p><b>— Enrile</b></article></div></div><p id="status" role="status">Start the camera and point at the test QR. Leave space above it for the card.</p><button id="start">Start camera</button><label class="file">Choose QR image<input id="file" type="file" accept="image/*"></label></main><script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script><script>
const $=id=>document.getElementById(id),v=$('video'),photo=$('photo'),view=$('view'),a=$('anchor'),status=$('status'),canvas=document.createElement('canvas'),ctx=canvas.getContext('2d',{willReadFrequently:true});let stream=null,raf=0,seq=0,last=0,seen=0,smoothed=null,still=null;
function hide(){a.classList.remove('visible');$('guide').hidden=false;smoothed=null}
function stop(){seq++;cancelAnimationFrame(raf);if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;v.srcObject=null;$('start').disabled=false;hide()}
function scan(src,w,h){if(!w||!h)return null;const k=Math.min(1,960/Math.max(w,h));canvas.width=Math.round(w*k);canvas.height=Math.round(h*k);ctx.drawImage(src,0,0,canvas.width,canvas.height);const q=jsQR(ctx.getImageData(0,0,canvas.width,canvas.height).data,canvas.width,canvas.height,{inversionAttempts:'dontInvert'});if(!q||q.data!=='ENDREAL:TEST:001')return null;const scale=Math.min(view.clientWidth/w,view.clientHeight/h),ox=(view.clientWidth-w*scale)/2,oy=(view.clientHeight-h*scale)/2;return ['topLeftCorner','topRightCorner','bottomRightCorner','bottomLeftCorner'].map(n=>({x:ox+q.location[n].x*scale*w/canvas.width,y:oy+q.location[n].y*scale*h/canvas.height}))}
// Projective homography: maps the four corners of a 200px square onto the detected QR quadrilateral.
function matrix(p){const [A,B,C,D]=p,dx1=B.x-C.x,dx2=D.x-C.x,dx3=A.x-B.x+C.x-D.x,dy1=B.y-C.y,dy2=D.y-C.y,dy3=A.y-B.y+C.y-D.y,den=dx1*dy2-dx2*dy1;if(Math.abs(den)<.001)return null;const g=(dx3*dy2-dx2*dy3)/den,h=(dx1*dy3-dx3*dy1)/den;const x=B.x-A.x+g*B.x,y=D.x-A.x+h*D.x,u=B.y-A.y+g*B.y,z=D.y-A.y+h*D.y;if(Math.min(1+g,1+h,1+g+h,1-h*1.1,1+g-h*1.1)<.15)return null;return [x/200,u/200,0,g/200,y/200,z/200,0,h/200,0,0,1,0,A.x,A.y,0,1]}
function show(p,t){const candidate=smoothed?p.map((q,i)=>({x:smoothed[i].x*.42+q.x*.58,y:smoothed[i].y*.42+q.y*.58})):p;const m=matrix(candidate);if(!m)return false;smoothed=candidate;a.style.transform='matrix3d('+m.join(',')+')';a.classList.add('visible');$('guide').hidden=true;seen=t;status.textContent='Card unlocked · keep the QR in view.';return true}
function tick(t){if(!stream)return;if(t-last>75&&v.readyState>=2){last=t;try{const p=scan(v,v.videoWidth,v.videoHeight);if(p)show(p,t)}catch(e){status.textContent='Unable to read camera frame.'}}if(t-seen>350&&a.classList.contains('visible')){hide();status.textContent='Point your camera at the test QR.'}raf=requestAnimationFrame(tick)}
async function start(){stop();still=null;photo.hidden=true;v.hidden=false;if(typeof jsQR!=='function'){status.textContent='Scanner library failed to load. Refresh.';return}if(!navigator.mediaDevices?.getUserMedia){status.textContent='Camera requires HTTPS and a supported browser.';return}const token=++seq;$('start').disabled=true;try{const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});if(token!==seq){s.getTracks().forEach(t=>t.stop());return}stream=s;v.srcObject=s;await v.play();if(token!==seq)return;status.textContent='Point your camera at the test QR.';raf=requestAnimationFrame(tick)}catch(e){if(token!==seq)return;stop();status.textContent='Camera unavailable. Allow camera access or choose a QR image.'}}
$('start').onclick=start;$('file').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;stop();const token=seq;const url=URL.createObjectURL(f);try{photo.src=url;await photo.decode();if(token!==seq)return;photo.hidden=false;v.hidden=true;still=photo;const p=scan(photo,photo.naturalWidth,photo.naturalHeight);if(!p||!show(p,performance.now()))status.textContent='No matching test QR found.';else status.textContent='Image preview · use live camera for tracking.'}catch(e){status.textContent='Could not read the image.'}finally{URL.revokeObjectURL(url)}};window.addEventListener('resize',()=>{hide();if(still&&!stream){const p=scan(still,still.naturalWidth,still.naturalHeight);if(p)show(p,performance.now())}});window.addEventListener('pagehide',stop);document.addEventListener('visibilitychange',()=>{if(document.hidden){stop();status.textContent='Tap Start camera to resume.'}});
</script></body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>End Real · QR test</title><link rel="stylesheet" href="style.css"><style>
body{min-height:100svh;background:#171a24;color:white}main{max-width:480px;margin:auto;padding:24px;display:grid;gap:18px}header{display:flex;justify-content:space-between;align-items:center}a{color:inherit}#camera{position:relative;overflow:hidden;border-radius:24px;background:#303644;aspect-ratio:3/4}video{width:100%;height:100%;object-fit:cover}#frame{position:absolute;inset:25%;border:3px solid white;border-radius:20px;pointer-events:none}#overlay{position:fixed;inset:0;display:grid;place-items:center;background:#0008;padding:24px}#overlay[hidden]{display:none}.letter{width:min(100%,390px);animation:pop .4s ease-out}.letter-body{text-align:center;display:grid;gap:14px;padding:30px}.gift{font-size:52px;color:#3971fb}@keyframes pop{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:scale(1)}}#status{min-height:3em;text-align:center}button:disabled{opacity:.5}label{text-align:center}input{max-width:100%}@media(prefers-reduced-motion:reduce){.letter{animation:none}}
</style></head><body><main><header><strong>✦ END REAL</strong><a href="index.html">Close</a></header><div id="camera"><video id="video" playsinline muted></video><div id="frame"></div></div><p id="status" role="status">Scan the End Real test QR code.</p><button class="btn" id="start">Start camera</button><label>Or choose a QR image <input id="file" type="file" accept="image/*"></label></main><div id="overlay" hidden role="dialog" aria-modal="true" aria-labelledby="title"><article class="letter"><div class="letter-top">END REAL · 001 ✦</div><div class="letter-body"><div class="gift" aria-hidden="true">✦</div><h1 id="title">Hello, there!</h1><p>You've successfully unlocked your first digital card.</p><p class="letter-sign">— Enrile</p><button class="btn" id="again">Scan again</button></div></article></div>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script><script>
const $=id=>document.getElementById(id),video=$('video'),status=$('status'),canvas=document.createElement('canvas'),ctx=canvas.getContext('2d',{willReadFrequently:true});let stream=null,raf=0,busy=false,unlocked=false,last=0,generation=0,cooldown=0;
function stop(){generation++;cancelAnimationFrame(raf);raf=0;if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;video.srcObject=null;$('start').disabled=false;busy=false}
function decode(source,w,h){if(!w||!h)return false;const scale=Math.min(1,1000/Math.max(w,h));canvas.width=Math.max(1,Math.round(w*scale));canvas.height=Math.max(1,Math.round(h*scale));ctx.drawImage(source,0,0,canvas.width,canvas.height);const result=jsQR(ctx.getImageData(0,0,canvas.width,canvas.height).data,canvas.width,canvas.height,{inversionAttempts:'attemptBoth'});if(!result)return false;if(result.data!=='ENDREAL:TEST:001'){status.textContent='Not an End Real test QR. Try the supplied code.';return false}unlocked=true;cancelAnimationFrame(raf);$('overlay').hidden=false;$('again').focus();status.textContent='Card unlocked!';return true}
function tick(t){if(unlocked||!stream)return;if(t>cooldown&&t-last>120&&video.readyState>=2){last=t;if(decode(video,video.videoWidth,video.videoHeight))return}raf=requestAnimationFrame(tick)}
async function start(){if(busy||stream)return;if(typeof jsQR!=='function'){status.textContent='Scanner failed to load. Refresh and try again.';return}if(!navigator.mediaDevices?.getUserMedia){status.textContent='Camera requires HTTPS and a supported browser.';return}busy=true;const token=++generation;$('start').disabled=true;try{const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});if(token!==generation){s.getTracks().forEach(t=>t.stop());return}stream=s;video.srcObject=s;await video.play();if(token!==generation)return;status.textContent='Point your camera at the test QR.';raf=requestAnimationFrame(tick)}catch(e){if(token!==generation)return;stop();status.textContent='Camera unavailable. Allow camera access or choose a QR image.'}finally{if(token===generation)busy=false}}
$('start').onclick=start;$('again').onclick=()=>{$('overlay').hidden=true;unlocked=false;cooldown=performance.now()+1500;status.textContent='Scan another QR.';if(stream){raf=requestAnimationFrame(tick)}else{$('start').focus()}};$('file').onchange=async e=>{const file=e.target.files[0];e.target.value='';if(!file)return;stop();unlocked=false;if(typeof jsQR!=='function'){status.textContent='Scanner failed to load. Refresh and try again.';return}const url=URL.createObjectURL(file);try{const img=new Image();img.src=url;await img.decode();status.textContent='No matching QR found in this image.';decode(img,img.naturalWidth,img.naturalHeight)}catch(err){status.textContent='Could not read this image.'}finally{URL.revokeObjectURL(url)}};window.addEventListener('pagehide',stop);document.addEventListener('visibilitychange',()=>{if(document.hidden)stop()});
</script></body></html>

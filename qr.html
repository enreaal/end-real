function memoryKey(value){if(Object.prototype.hasOwnProperty.call(memories,value))return value;try{const u=new URL(value);if(u.origin==='https://endforreal.vercel.app'&&u.pathname==='/'){const id=u.searchParams.get('m');const key='ENDREAL:MEMORY:'+id;if(/^[A-Za-z0-9_-]{16}$/.test(id||'')&&Object.prototype.hasOwnProperty.call(memories,key))return key;}}catch(e){}return null;}
let currentMemory=null;
function setMemory(key){if(currentMemory===key)return;currentMemory=key;const memory=memories[key],card=$('card'),img=$('memory-image');card.querySelector('small').textContent=memory.label;card.querySelector('h1').textContent=memory.title;card.querySelector('p').textContent=memory.message;card.classList.toggle('has-image',!!memory.image);img.hidden=!memory.image;if(memory.image){img.src=memory.image;img.alt='Kenangan '+memory.title;img.onerror=()=>{img.hidden=true;card.classList.remove('has-image');card.querySelector('p').textContent='Ilustrasi belum tersedia. '+memory.message;};img.onload=()=>{img.hidden=false;card.classList.add('has-image');}}else img.removeAttribute('src');}

function scan(src,w,h){if(!w||!h)return null;const k=Math.min(1,960/Math.max(w,h));canvas.width=Math.round(w*k);canvas.height=Math.round(h*k);ctx.drawImage(src,0,0,canvas.width,canvas.height);const q=jsQR(ctx.getImageData(0,0,canvas.width,canvas.height).data,canvas.width,canvas.height,{inversionAttempts:'dontInvert'});const key=q&&memoryKey(q.data);if(!key)return null;setMemory(key);const scale=Math.min(view.clientWidth/w,view.clientHeight/h),ox=(view.clientWidth-w*scale)/2,oy=(view.clientHeight-h*scale)/2;return ['topLeftCorner','topRightCorner','bottomRightCorner','bottomLeftCorner'].map(n=>({x:ox+q.location[n].x*scale*w/canvas.width,y:oy+q.location[n].y*scale*h/canvas.height}))}
// Projective homography: maps the four corners of a 200px square onto the detected QR quadrilateral.
function matrix(p){const [A,B,C,D]=p,dx1=B.x-C.x,dx2=D.x-C.x,dx3=A.x-B.x+C.x-D.x,dy1=B.y-C.y,dy2=D.y-C.y,dy3=A.y-B.y+C.y-D.y,den=dx1*dy2-dx2*dy1;if(Math.abs(den)<.001)return null;const g=(dx3*dy2-dx2*dy3)/den,h=(dx1*dy3-dx3*dy1)/den;const x=B.x-A.x+g*B.x,y=D.x-A.x+h*D.x,u=B.y-A.y+g*B.y,z=D.y-A.y+h*D.y;if(Math.min(1+g,1+h,1+g+h,1-h*1.1,1+g-h*1.1)<.15)return null;return [x/200,u/200,0,g/200,y/200,z/200,0,h/200,0,0,1,0,A.x,A.y,0,1]}
function placeCard(m){
 const card=$('card'),w=card.offsetWidth,h=card.offsetHeight,W=view.clientWidth,H=view.clientHeight;
 if(!w||!h)return;
 const project=(x,y)=>{const d=m[3]*x+m[7]*y+1;if(d<=.15)return null;return{x:(m[0]*x+m[4]*y+m[12])/d,y:(m[1]*x+m[5]*y+m[13])/d}};
 const bounds=(x,y,s)=>{const pts=[[x,y],[x+w*s,y],[x+w*s,y+h*s],[x,y+h*s]].map(([u,v])=>project(u,v));if(pts.some(p=>!p))return null;return{l:Math.min(...pts.map(p=>p.x)),r:Math.max(...pts.map(p=>p.x)),t:Math.min(...pts.map(p=>p.y)),b:Math.max(...pts.map(p=>p.y))}};

 for(const s of [1,.86,.72,.6,.48,.36,.26])for(const pos of ['above','below','left','right','center']){

 }

}
function show(p,t){const candidate=smoothed?p.map((q,i)=>({x:smoothed[i].x*.42+q.x*.58,y:smoothed[i].y*.42+q.y*.58})):p;const m=matrix(candidate);if(!m)return false;smoothed=candidate;a.style.transform='matrix3d('+m.join(',')+')';placeCard(m);a.classList.add('visible');$('guide').hidden=true;seen=t;status.textContent='Kenangan terbuka · arahkan kamera ke QR.';return true}

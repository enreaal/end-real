<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kartu Cetak</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <style>
    @page { size: 105mm 148mm; margin: 0; }
    .toolbar { max-width: 960px; margin: 0 auto; padding: 28px 24px 8px; display: flex; flex-wrap: wrap; gap: 16px; align-items: center; justify-content: space-between; }
    .toolbar h1 { font: 600 30px/1.1 var(--font-display); }
    .toolbar p { color: var(--color-muted); line-height: 1.5; max-width: 520px; margin-top: 4px; font-size: 14px; }
    .toolbar .btn { width: auto; }
    .warn { max-width: 912px; margin: 8px auto 0; padding: 12px 16px; border-radius: 14px; background: #fff1f1; color: #b4232a; font-weight: 700; font-size: 14px; }
    .sheet { display: flex; flex-wrap: wrap; gap: 24px; justify-content: center; padding: 24px; }

    /* One A6 card: 105 × 148 mm (design grid 1 mm = 4 px) */
    .card {
      position: relative; overflow: hidden;
      width: 105mm; height: 148mm;
      background: var(--color-paper); color: var(--color-ink);
      padding: 6mm 6mm 0;
      box-shadow: 0 10px 30px rgba(57, 113, 251, .15);
      border-radius: 3mm;
      -webkit-print-color-adjust: exact; print-color-adjust: exact;
    }
    .card .blob { position: absolute; left: -15mm; top: -17.5mm; width: 65mm; height: 50mm; background: var(--color-blob-soft); border-radius: 46% 54% 42% 58% / 55% 45% 55% 45%; }
    .card .head { position: relative; display: flex; justify-content: space-between; align-items: center; font: 800 3mm/1 var(--font-body); letter-spacing: .14em; text-transform: uppercase; color: var(--color-accent); }
    .card .head .l { display: inline-flex; align-items: center; gap: 2mm; }
    .card .head svg { width: 3.6mm; height: 3.6mm; fill: var(--color-accent); }
    .card .head .no { color: var(--color-muted); }
    /* The tracked photo: printed whole, nothing on top of it. */
    .card .photo { position: relative; margin-top: 4mm; padding: 2mm; border-radius: 6mm; background: var(--color-paper); box-shadow: 0 0 0 .5mm var(--color-line); }
    .card .photo img { display: block; width: 100%; aspect-ratio: 1; object-fit: contain; border-radius: 4.5mm; background: var(--color-ground); }
    .card .foot { display: flex; align-items: flex-end; gap: 2mm; margin-top: 5mm; }
    .card .foot .av { flex: none; width: 24mm; margin: 0 -2mm -1.5mm -3mm; }
    .card .who { flex: 1; min-width: 0; }
    .card h2 { font: 600 8.5mm/1 var(--font-display); overflow-wrap: anywhere; }
    .card h2 span { color: var(--color-accent); }
    .card .tip { font: 500 4.6mm/1.15 var(--font-hand); color: var(--color-muted); margin-top: 1.5mm; }
    .card .qr { flex: none; text-align: center; padding: 2mm; border-radius: 3.5mm; box-shadow: 0 0 0 .5mm var(--color-line); }
    .card .qr svg { display: block; width: 22mm; height: 22mm; }
    .card .qr p { font: 800 2.4mm/1 var(--font-body); letter-spacing: .12em; text-transform: uppercase; color: var(--color-accent); margin-top: 1.5mm; }

    @media print {
      html, body { background: #fff; }
      .toolbar, .warn { display: none !important; }
      .sheet { display: block; padding: 0; }
      .card { box-shadow: none; border-radius: 0; page-break-after: always; break-after: page; }
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <div>
      <h1>Kartu <span style="color:var(--color-accent)">cetak</span></h1>
      <p>Ukuran A6 (10,5 × 14,8 cm), satu kartu per halaman. Saat mencetak: kertas A6 (atau pilih "pages per sheet" untuk A4), skala 100%, centang <b>Background graphics</b>.</p>
    </div>
    <button class="btn" onclick="print()">Cetak kartu</button>
  </div>
  <div class="warn" id="warn" hidden></div>
  <div class="sheet" id="sheet"></div>

  <script src="data.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
  <script>
    const data = window.FAREWELL;
    const esc = (s) => String(s).replace(/[&<>"']/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
    const STAR = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 0c.9 6.4 5.6 11.1 12 12-6.4.9-11.1 5.6-12 12-.9-6.4-5.6-11.1-12-12C6.4 11.1 11.1 6.4 12 0z"/></svg>`;

    // QR points at the landing page for this colleague.
    const base = (data.baseUrl || location.href.replace(/[^/]*([?#].*)?$/, "")).replace(/\/?$/, "/");
    if (!data.baseUrl || /localhost|127\.0\.0\.1|^file:/.test(base)) {
      const w = document.getElementById("warn");
      w.hidden = false;
      w.textContent = `Kode QR sekarang mengarah ke ${base}. Isi baseUrl di data.js dengan alamat situs yang sudah di-deploy sebelum mencetak.`;
    }

    const nameHtml = (n) => {
      const parts = String(n).trim().split(/\s+/);
      if (parts.length < 2) return esc(n);
      const last = parts.pop();
      return `${esc(parts.join(" "))} <span>${esc(last)}</span>`;
    };

    const qrSvg = (url) => {
      const q = qrcode(0, "M");
      q.addData(url);
      q.make();
      return q.createSvgTag({ cellSize: 4, margin: 0, scalable: true });
    };

    document.getElementById("sheet").innerHTML = data.colleagues.map((p, i) => {
      const url = `${base}?c=${encodeURIComponent(p.id)}`;
      return `
        <section class="card">
          <div class="blob"></div>
          <div class="head"><span class="l">Untukmu ${STAR}</span><span class="no">No. ${String(i + 1).padStart(2, "0")}</span></div>
          <div class="photo"><img src="${esc(p.target)}" alt="Foto untuk ${esc(p.name)}"></div>
          <div class="foot">
            <div class="av"><img src="assets/me.png" alt=""></div>
            <div class="who">
              <h2>${nameHtml(p.name)}</h2>
              <p class="tip">Pindai kodenya, lalu arahkan kamera ke foto ini.</p>
            </div>
            <div class="qr" title="${esc(url)}">${qrSvg(url)}<p>pindai aku</p></div>
          </div>
        </section>`;
    }).join("");
  </script>
</body>
</html>
